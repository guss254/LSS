<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Presensi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }

        .container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 90%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .form-group button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .form-group button:hover {
            background-color: #45a049;
        }

        .camera-preview {
            width: 100%;
            border: 1px solid #ddd;
            margin-top: 10px;
        }

        canvas {
            display: none;
        }

        .image-preview {
            width: 100%;
            margin-top: 10px;
            display: none;
        }
    </style>
    <!-- Include SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
    <h2>Form Presensi</h2>
    <form id="presensi-form" method="POST">
        <!-- Input Nama -->
        <div class="form-group">
            <label for="nama">Nama</label>
            <input type="text" id="nama" name="nama" required>
        </div>

        <div class="form-group">
            <label for="unit_kerja">Unit Kerja</label>
            <input type="text" id="unit_kerja" name="unit_kerja" required>
        </div>

        <div class="form-group">
            <label for="waktu">Tanggal & Waktu</label>
            <input type="text" id="waktu" name="waktu" class="readonly-input" readonly required>
        </div>

        <div class="form-group">
            <label for="alamat">Alamat</label>
            <input type="text" id="alamat" name="alamat" class="readonly-input" readonly required>
        </div>

        <div class="form-group">
            <label for="kamera">Ambil Foto</label>
            <video id="camera" class="camera-preview" autoplay></video>
            <button type="button" id="capture-btn">Ambil Foto</button>
            <canvas id="canvas"></canvas>
            <input type="hidden" name="foto" id="foto">
        </div>

        <div class="form-group">
            <label>Preview Foto</label>
            <img id="image-preview" class="image-preview" alt="Foto Preview">
        </div>

        <div class="form-group">
            <button type="submit" id="save-btn">Simpan Presensi</button>
        </div>
    </form>
    <button onclick="saveToExcel()" class="form-group" style="width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer;">Download Excel</button>
</div>

<script>
    function formatTanggalWaktu() {
        const options = { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit', 
            timeZoneName: 'short' 
        };
        const waktu = new Date().toLocaleString('id-ID', options);
        document.getElementById('waktu').value = waktu;
    }
    formatTanggalWaktu();

    function getLokasi() {
		if (navigator.geolocation) {
			navigator.geolocation.getCurrentPosition(function(position) {
				const latitude = position.coords.latitude;
				const longitude = position.coords.longitude;

				fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`)
					.then(response => response.json())
					.then(data => {
						const alamat = data.display_name || "Alamat tidak ditemukan";
						document.getElementById('alamat').value = alamat;
					})
					.catch(error => {
						console.error('Error getting address:', error);
						alert('Gagal mendapatkan alamat Anda.');
					});
			}, function(error) {
				console.error('Error getting geolocation:', error);
				alert('Gagal mendapatkan lokasi Anda.');
			});
		} else {
			alert('Geolokasi tidak didukung oleh browser Anda.');
		}
	}
    getLokasi();

    const camera = document.getElementById('camera');
    const captureBtn = document.getElementById('capture-btn');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const imagePreview = document.getElementById('image-preview'); // Preview image element

    navigator.mediaDevices.getUserMedia({ video: true })
        .then(function(stream) {
            camera.srcObject = stream;
        })
        .catch(function(error) {
            alert('Gagal mengakses kamera');
        });

    captureBtn.addEventListener('click', function() {
        canvas.width = camera.videoWidth;
        canvas.height = camera.videoHeight;

        context.drawImage(camera, 0, 0, canvas.width, canvas.height);

        const fotoBase64 = canvas.toDataURL('image/png');

        document.getElementById('foto').value = fotoBase64;

        imagePreview.src = fotoBase64;
        imagePreview.style.display = 'block';
    });

    function saveToExcel() {
        const formData = {
            Nama: document.getElementById('nama').value,
            'Unit Kerja': document.getElementById('unit_kerja').value,
            'Tanggal & Waktu': document.getElementById('waktu').value,
            Alamat: document.getElementById('alamat').value,
            Foto: document.getElementById('foto').value
        };

        const ws = XLSX.utils.json_to_sheet([formData]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Presensi');

        // Download the Excel file
        XLSX.writeFile(wb, 'form_presensi.xlsx');
    }
</script>

</body>
</html>
